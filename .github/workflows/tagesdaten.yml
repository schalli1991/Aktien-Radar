name: Tagesdaten

# Läuft automatisch Montag bis Freitag um 23:15 Uhr Schweizer Zeit (22:15 UTC, nach US-Börsenschluss)
# und kann jederzeit von Hand gestartet werden: Actions → "Tagesdaten" → "Run workflow".
on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tagesdaten
  cancel-in-progress: false

jobs:
  rechnen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Tagesdaten rechnen
        run: python scripts/tagesdaten.py
      - name: Momentum-Bestand speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/momentum_bestand.json
          git diff --cached --quiet || git commit -m "Momentum-Bestand aktualisiert"
          git pull --rebase origin main && git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
