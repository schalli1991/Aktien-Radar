name: Aufmerksamkeit holen

# Startet von Hand: GitHub → Actions → "Aufmerksamkeit holen" → "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Wikipedia-Aufrufe und Marktwerte laden
        run: python scripts/aufmerksamkeit_holen.py
      - name: Ergebnis speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config daten berichte
          git diff --cached --quiet || git commit -m "Aufmerksamkeitsdaten aktualisiert"
          git push
